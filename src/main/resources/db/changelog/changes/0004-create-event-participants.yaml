databaseChangeLog:
  - changeSet:
      id: 0004-create-event-participants
      author: Ali Eldiasty
      changes:
        - createTable:
            tableName: event_participants
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: event_participants
            columnNames: event_id, user_id
            constraintName: uk_event_participants_event_user
        - addForeignKeyConstraint:
            baseTableName: event_participants
            baseColumnNames: event_id
            referencedTableName: events
            referencedColumnNames: id
            constraintName: fk_event_participants_event
        - addForeignKeyConstraint:
            baseTableName: event_participants
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_event_participants_user
        - createIndex:
            tableName: event_participants
            indexName: idx_event_participants_event
            columns:
              - column:
                  name: event_id
        - createIndex:
            tableName: event_participants
            indexName: idx_event_participants_user
            columns:
              - column:
                  name: user_id
