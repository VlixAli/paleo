spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/paleo
          audiences:
            - paleo-backend
  datasource:
    url: jdbc:postgresql://localhost:5434/paleo
    username: ${DB_USERNAME:paleo}
    password: ${DB_PASSWORD:paleo}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  liquibase:
    change-log: classpath:db/changelog/root-changelog.yaml
server:
  port: 8082